<style>
  .gradient-text {
    font-size: 20px;
    font-weight: 700;
  }
</style>

<div class="gradient-text">AI Lead<br />Generation</div>

<script>
  function lerp(a, b, t) {
    return a + (b - a) * t;
  }
  function clamp(v, mn, mx) {
    return Math.max(mn, Math.min(mx, v));
  }
  function h2r(hex) {
    return [
      parseInt(hex.slice(1, 3), 16),
      parseInt(hex.slice(3, 5), 16),
      parseInt(hex.slice(5, 7), 16),
    ];
  }
  function r2h(r, g, b) {
    return (
      "#" +
      [r, g, b]
        .map((v) =>
          Math.round(clamp(v, 0, 255))
            .toString(16)
            .padStart(2, "0"),
        )
        .join("")
    );
  }

  const cA = h2r("#1a1a1a"),
    cB = h2r("#7a2a0a"),
    cC = h2r("#cc3a10");
  const sA = h2r("#ff4400"),
    sB = h2r("#ff9900");

  function gradColor(t) {
    if (t < 0.5) {
      const tt = t / 0.5;
      return cA.map((c, k) => lerp(c, cB[k], tt));
    } else {
      const tt = (t - 0.5) / 0.5;
      return cB.map((c, k) => lerp(c, cC[k], tt));
    }
  }

  function applyEffect(wrap) {
    const rawHTML = wrap.innerHTML;
    const lines = rawHTML
      .split(/<br\s*\/?>/i)
      .map((l) => l.trim())
      .filter(Boolean);
    wrap.innerHTML = "";

    const fs = parseFloat(getComputedStyle(wrap).fontSize);
    const allLetters = [];

    lines.forEach((lineText) => {
      const lineEl = document.createElement("div");
      lineEl.style.cssText =
        "display:flex;flex-wrap:nowrap;line-height:1;margin-bottom:-0.02em;";
      lineText
        .split(/\s+/)
        .filter(Boolean)
        .forEach((word, wi) => {
          if (wi > 0) {
            const sp = document.createElement("span");
            sp.style.cssText = "display:inline-block;width:0.28em;";
            lineEl.appendChild(sp);
          }
          [...word].forEach((ch) => {
            const s = document.createElement("span");
            s.textContent = ch;
            s.style.cssText = "display:inline-block;";
            lineEl.appendChild(s);
            allLetters.push(s);
          });
        });
      wrap.appendChild(lineEl);
    });

    const N = allLetters.length;
    if (N === 0) return;

    const GRAD_START = N <= 4 ? 0 : N - Math.round(N * 0.6);
    const GRAD_TOTAL = N - GRAD_START;
    const STROKE_COUNT = Math.max(1, Math.round(N * 0.35));
    const STROKE_START = N - STROKE_COUNT;
    const glowMult = clamp(0.25 + (N / 10) * 0.75, 0.25, 1.0);

    allLetters.forEach((span, i) => {
      let fill;

      if (i < GRAD_START) {
        fill = r2h(...cA);
      } else {
        const t = GRAD_TOTAL <= 1 ? 1 : (i - GRAD_START) / (GRAD_TOTAL - 1);
        fill = r2h(...gradColor(t));
      }

      span.style.color = fill;

      if (i >= STROKE_START) {
        const st =
          STROKE_COUNT === 1 ? 1 : (i - STROKE_START) / (STROKE_COUNT - 1);
        const strokeW = lerp(0.014, 0.028, st) * fs;
        const sw = strokeW.toFixed(2);
        const d = (strokeW * 0.65).toFixed(2);
        const glowSpread = (lerp(0.02, 0.08, st) * fs * glowMult).toFixed(2);
        const glowOffset = (0.04 * fs).toFixed(2);
        const blurPx = (lerp(0, 0.01, st) * fs).toFixed(2);

        const sc = sA.map((c, k) => lerp(c, sB[k], st));
        const strokeCol = r2h(...sc);

        span.style.webkitTextFillColor = fill;
        span.style.textShadow = `
        -${sw}px -${sw}px 0 ${strokeCol},
         ${sw}px -${sw}px 0 ${strokeCol},
        -${sw}px  ${sw}px 0 ${strokeCol},
         ${sw}px  ${sw}px 0 ${strokeCol},
        -${sw}px 0 0 ${strokeCol},
         ${sw}px 0 0 ${strokeCol},
        0 -${sw}px 0 ${strokeCol},
        0  ${sw}px 0 ${strokeCol},
        -${d}px -${d}px 0 ${strokeCol},
         ${d}px -${d}px 0 ${strokeCol},
        -${d}px  ${d}px 0 ${strokeCol},
         ${d}px  ${d}px 0 ${strokeCol},
        0 ${glowOffset}px ${glowSpread}px ${strokeCol}
      `;
        if (blurPx > 0.05) span.style.filter = `blur(${blurPx}px)`;
      }
    });
  }

  document.querySelectorAll(".gradient-text").forEach(applyEffect);
</script>
